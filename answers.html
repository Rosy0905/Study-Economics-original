<script>
/* 答案册的条目是 .item，不是卡片列表页的 .card-item；
   适配器把「当前卡片」定义为题号面板高亮的那一题。 */
(function () {
  'use strict';
  function findItem(id) {
    var book = window.ANSWER_BOOK;
    if (!book || !book.papers) return null;
    for (var i = 0; i < book.papers.length; i++) {
      var paper = book.papers[i];
      var parts = paper.parts || [];
      for (var j = 0; j < parts.length; j++) {
        var items = parts[j].items || [];
        for (var k = 0; k < items.length; k++) {
          if (items[k].id === id) return { paper: paper, part: parts[j], item: items[k] };
        }
      }
    }
    return null;
  }
  function labelOf(el) {
    if (!el || !el.id) return '';
    var hit = findItem(el.id), type = hit ? (hit.part.type || '') : '';
    var noEl = el.querySelector('.q-head .no');
    var no = noEl ? noEl.textContent.replace(/\s+/g, ' ').trim() : '';
    var title = hit ? String(hit.paper.title || '').replace(/\s+/g, ' ') : '';
    return (title ? title + ' · ' : '') + (type ? type + ' ' : '') + '第 ' + no + ' 题';
  }
  window.__AI_CARD_ADAPTER__ = {
    all: function () { return document.querySelectorAll('#content .item'); },
    key: function (el) { return (el && el.id) ? 'id:' + el.id : ''; },
    label: labelOf,
    read: function (el, withAnswer) {
      if (!el || !el.id) return null;
      var stemEl = el.querySelector('.q-head .stem');
      var ansEl = el.querySelector('.ans-body');
      var qTxt = '';
      if (stemEl) {
        var c = stemEl.cloneNode(true);
        Array.prototype.forEach.call(c.querySelectorAll('th,td'), function (td) {
          td.appendChild(document.createTextNode(' '));
        });
        qTxt = c.textContent.replace(/\n{3,}/g, '\n\n').trim();
      }
      return {
        key: 'id:' + el.id,
        label: labelOf(el),
        q: qTxt,
        a: (withAnswer && ansEl) ? ansEl.textContent.replace(/\n{3,}/g, '\n\n').trim() : '',
        n: ''
      };
    },
    focus: function () {
      var on = document.querySelector('#npRows a.on');
      if (!on || !on.dataset.id) return null;
      var el = document.getElementById(on.dataset.id);
      if (!el || !el.classList.contains('item')) return null;
      var r = el.getBoundingClientRect();
      var vh = window.innerHeight || 800;
      if (r.bottom <= 0 || r.top >= vh) return null;
      return el;
    }
  };
})();
</script>
